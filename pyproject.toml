[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tests/v0_reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
# v0 regex tables are long by nature; v0's `!=` type comparisons are kept as written.
# W291/W293: trailing whitespace inside the persona prompt strings is prompt content (E1 must match v0).
"src/agents.py" = ["E501", "E721", "W291", "W293"]
"src/states.py" = ["E501"]
"src/utils.py" = ["W293"]
