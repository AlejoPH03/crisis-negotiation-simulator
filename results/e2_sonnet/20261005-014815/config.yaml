condition: E2
description: Model swap only. last_message memory, regex detectors, rule engine and
  canned lines.
llm:
  backend: claude
  model: claude-sonnet-4-6
  temperature: 0.6
  max_tokens: 300
  backend_options: {}
  opening_user_message: (The phone line connects. You speak first.)
game:
  memory_mode: last_message
  detection_mode: regex
  decision_mode: rules
  max_rounds: 10
  fbi_personas:
  - fbi_empathy
  - fbi_authority
  criminal_personas:
  - criminal_unstable
  - criminal_calculated
  starts_with:
  - fbi
  - criminal
run:
  runs_per_configuration: 10
  seed: 20261003
  output_dir: results/e2_sonnet
  compute_perplexity: true
  max_consecutive_failures: 3
retry:
  max_retries: 5
  base_delay_s: 2.0
  max_delay_s: 60.0
budget:
  cap_usd: 6.0
  pricing:
    claude-sonnet-4-6:
      input_per_mtok: 3.0
      output_per_mtok: 15.0
